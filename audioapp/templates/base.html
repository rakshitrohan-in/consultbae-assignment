<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audio Submission Tool{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #dfe3e8;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    nav .brand { font-weight: 700; }
    nav a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 18px;
      font-size: 0.95rem;
    }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 20px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }
    h1 { font-size: 1.5rem; margin-top: 0; }
    .flash {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    .flash.success { background: #ecfdf3; color: var(--success); border: 1px solid #bbf7d0; }
    .flash.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Audio Submission Tool</span>
    <div>
      <a href="{{ url_for('index') }}">Submit</a>
      <a href="{{ url_for('submissions') }}">Submissions</a>
    </div>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
